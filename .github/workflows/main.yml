name: Dev build

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  push-dev-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Docker Compose build
        run: docker compose build

      - name: Tag and push backend image
        run: |
          docker tag ai-backend "${{ secrets.DOCKERHUB_USERNAME }}"/ai-backend:0.0.0.${{ github.run_number }}-dev
          docker push "${{ secrets.DOCKERHUB_USERNAME }}"/ai-backend:0.0.0.${{ github.run_number }}-dev

  pull-dev-image:
    runs-on: ubuntu-latest
    needs: push-dev-image

    steps:
      - name: Save PEM to file
        run: |
          echo "${{ secrets.EC2_PEM }}" > key.pem
          chmod 600 key.pem

      - name: Pull image on EC2 via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@${{ secrets.EC2_HOST }} << EOF
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull bodya4000/ai-backend:0.0.0.${{ github.run_number }}-dev
            docker stop ai-backend || true
            docker rm ai-backend || true
            docker run -d --name ai-backend -p 8080:8080 bodya4000/ai-backend:0.0.0.${{ github.run_number }}-dev
          EOF
