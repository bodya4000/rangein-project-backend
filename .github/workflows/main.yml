name: Dev build

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  push-dev-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Docker login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Docker Compose build
        run: docker compose build

      - name: Tag and push backend image
        run: |
          docker tag ai-backend "${{ secrets.DOCKERHUB_USERNAME }}"/ai-backend:0.0.0.${{ github.run_number }}-dev
          docker push "${{ secrets.DOCKERHUB_USERNAME }}"/ai-backend:0.0.0.${{ github.run_number }}-dev

  pull-dev-image:
    runs-on: ubuntu-latest
    needs: push-dev-image

    steps:
      - name: Save PEM to file
        run: |
          echo "${{ secrets.EC2_PEM }}" > mac.pem
          chmod 600 mac.pem
      
      - name: Login to Docker on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i mac.pem ${{ secrets.EC2_HOST }} \
            "bash -c 'echo \"${{ secrets.DOCKERHUB_TOKEN }}\" | docker login -u \"${{ secrets.DOCKERHUB_USERNAME }}\" --password-stdin'"
      - name: Pull image on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i mac.pem ${{ secrets.EC2_HOST }} \
            "docker pull '${{ secrets.DOCKERHUB_USERNAME }}/ai-backend:0.0.0.${{ github.run_number }}-dev'"

      - name: Free port 8080 if busy
        run: |
          ssh -o StrictHostKeyChecking=no -i mac.pem ${{ secrets.EC2_HOST }} \
            "docker ps -q --filter 'publish=8080' | xargs -r docker stop && \
             docker ps -aq --filter 'publish=8080' | xargs -r docker rm || true"
      
      - name: Remove existing container on EC2 (if exists)
        run: |
          ssh -o StrictHostKeyChecking=no -i mac.pem ${{ secrets.EC2_HOST }} \
            "docker rm ai-backend || true"
      
      - name: Run container on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i mac.pem ${{ secrets.EC2_HOST }} \
            "docker run -d --name ai-backend -p 8080:8080 '${{ secrets.DOCKERHUB_USERNAME }}/ai-backend:0.0.0.${{ github.run_number }}-dev'"

